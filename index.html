<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Girlfriend's Day ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="app">

        <section id="opening-screen">
            <h1>For You 🌺</h1>
            <p>A little something I made for you</p>

            <button id="start-button">
                Begin
            </button>
        </section>

        <section id="garden-screen" class="hidden">
            <canvas id="garden"></canvas>

            <button id="continue-button" class="hidden">
                Continue
            </button>
        </section>

        <section id="letter-screen" class="hidden">
            <div id="letter">
                <h1>Happy Girlfriend's Day ❤️</h1>

                <p>
                    Your letter will go here.
                </p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
